name: Node.js CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dentalClinicUI/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dentalClinicUI/**'

defaults:
  run:
    working-directory: dentalClinicUI

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dentalClinicUI/package-lock.json

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          dentalClinicUI/node_modules
          ~/.npm
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('dentalClinicUI/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint
      continue-on-error: true

    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Run tests with coverage
      run: npm run test:coverage
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./dentalClinicUI/coverage/lcov.info
        flags: frontend
        fail_ci_if_error: false

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Check build size
      run: |
        echo "Build size:"
        du -sh dist/
        ls -lh dist/

    - name: Archive production artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-${{ matrix.node-version }}
        path: dentalClinicUI/dist
        retention-days: 7

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --production
      continue-on-error: true

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: dentalClinicUI/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint -- --format json --output-file eslint-report.json
      continue-on-error: true

    - name: Upload ESLint report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: eslint-report
        path: dentalClinicUI/eslint-report.json
        retention-days: 7

    - name: Check code formatting
      run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,css,scss,json}"
      continue-on-error: true

    - name: Analyze bundle size
      run: |
        npm run build
        npx vite-bundle-visualizer
      continue-on-error: true

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: dentalClinicUI/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      continue-on-error: true

    - name: Run E2E tests
      run: npm run test:e2e
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: dentalClinicUI/playwright-report
        retention-days: 7
