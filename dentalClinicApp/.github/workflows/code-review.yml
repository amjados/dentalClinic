name: Automated Code Review

on:  
  push:
    branches: [ main, develop ]

# Add permissions for GitHub Actions
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📦 Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🧪 Run Tests
      run: mvn clean test

    - name: 📈 Generate Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: 🧪 Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # SonarCloud scan removed - requires SONAR_TOKEN secret configuration
    # To enable: Set up SonarCloud account and add SONAR_TOKEN to GitHub secrets

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔍 Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: 🏗️ Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: 📋 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dependency-check:
    name: 🔐 Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: � Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🔍 Run Maven Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DsuppressationFile=owasp-suppression.xml \
          -Dformat=ALL || true
      continue-on-error: true

    - name: 📤 Upload Dependency Check Results
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.xml
          target/dependency-check-report.json
      if: always()