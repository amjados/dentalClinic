# Dental Clinic Management System - Main Configuration
# Profile is set via command line or environment variables
# For development: -Dspring.profiles.active=dev
# For testing: -Dspring.profiles.active=test  
# For production: -Dspring.profiles.active=prod

# Application Configuration
spring.application.name=dental-clinic-app

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Application Information for Actuator
info.app.name=Dental Clinic Management System
info.app.description=A comprehensive dental clinic management system built with Spring Boot
info.app.version=1.0.0
info.app.contact.name=Dental Clinic Development Team
info.app.contact.email=admin@dentalclinicapp.com

# Matrix Protocol Configuration (Real-time Chat)
# Enable or disable Matrix integration
matrix.enabled=true

# Matrix Homeserver URL (use public matrix.org or your own synapse server)
matrix.homeserver.url=http://localhost:8008

# Matrix Bot Credentials (create a bot account on your homeserver)
# Bot username format: @username:homeserver.com
matrix.bot.username=@dentalclinicapp_bot:dentalclinicapp.local
matrix.bot.password=DentalClinic2025!Bot

# Alternative: Use access token instead of password (more secure)
# Get this from /_matrix/client/r0/login response
matrix.bot.access.token=

# Room naming prefix for organizational purposes
matrix.room.prefix=dentalclinicapp
