# Development Profile for Dental Clinic Management System
# This profile enables automatic database setup and data seeding

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:50506;databaseName=dentalclinic;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=amjadOmar1!A
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# SA Database Configuration for Database Creation and Seeding
dev.db.url=jdbc:sqlserver://localhost:50506;databaseName=master;encrypt=false;trustServerCertificate=true
dev.db.username=sa
dev.db.password=amjadOmar1!A

# JPA Configuration for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always

# Server Configuration
server.port=8082

# Log4j2 Configuration
logging.config=classpath:log4j2-spring.xml

# Logging levels for database operations
logging.level.com.dentalclinic.dentalclinicapp=DEBUG
logging.level.com.dentalclinic.dentalclinicapp.config.DataInitializer=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc=TRACE

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator configuration for development
management.endpoints.web.exposure.include=health,info,metrics,env,beans,configprops,loggers,httptrace,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true

# Disable Redis health check (no Redis in this project)
management.health.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Database Information for Actuator
info.database.type=SQL Server
info.database.version=2019