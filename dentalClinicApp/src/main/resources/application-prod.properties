# Production Profile for Dental Clinic Management System
# This profile is for production environments - no automatic seeding

# Database configuration
spring.datasource.url=jdbc:sqlserver://localhost:50506;databaseName=dentalclinic;encrypt=false;trustServerCertificate=true
spring.datasource.username=amjad
spring.datasource.password=amjadOmar1!A
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate configuration for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false

# Log4j2 Configuration
logging.config=classpath:log4j2-spring.xml

# Logging configuration for production (less verbose)
logging.level.com.dentalclinic.dentalclinicmanagement=INFO
logging.level.com.dentalclinic.dentalclinicmanagement.config.DataInitializer=INFO
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

# Server configuration
server.port=8080

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator configuration for production (limited endpoints for security)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.info.env.enabled=true

# Production security settings
server.error.include-message=never
server.error.include-binding-errors=never